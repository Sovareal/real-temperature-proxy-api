apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-proxy-config
  labels:
    app: weather-proxy
data:
  WEATHER_UPSTREAM_BASE_URL: "https://api.open-meteo.com"
  WEATHER_UPSTREAM_TIMEOUT_MS: "1000"
  WEATHER_UPSTREAM_CONNECT_TIMEOUT_MS: "500"
  WEATHER_UPSTREAM_MAX_CONNECTIONS: "500"
  WEATHER_CACHE_TTL_SECONDS: "60"
  WEATHER_CACHE_MAX_SIZE: "10000"
  WEATHER_CACHE_COORDINATE_PRECISION: "4"
