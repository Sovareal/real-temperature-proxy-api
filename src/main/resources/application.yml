server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: weather-proxy
  lifecycle:
    timeout-per-shutdown-phase: 30s
  codec:
    max-in-memory-size: 256KB

weather:
  upstream:
    base-url: https://api.open-meteo.com
    timeout-ms: 1000
    connect-timeout-ms: 500
    max-connections: 500
  cache:
    ttl-seconds: 60
    max-size: 10000
    coordinate-precision: 4
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      slow-call-duration-threshold-ms: 800
      slow-call-rate-threshold: 80
      permitted-calls-in-half-open: 5
      sliding-window-size: 20
      wait-duration-in-open-state-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
